<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<link rel="manifest" href="manifest.json">
<title>Tabela Stackfall</title>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;500;700&display=swap" rel="stylesheet">
<style>
body {
  font-family: 'Poppins', sans-serif;
  background: linear-gradient(135deg, #7908dc, #2f014e);
  margin: 0;
  display: flex;
  justify-content: center;
  align-items: center;
  min-height: 100vh;
  padding: 15px;
}
.container {
  max-width: 600px;
  margin: auto;
  background: white;
  padding: 20px;
  border-radius: 18px;
  box-shadow: 0 4px 15px rgba(0,0,0,0.2);
}
h1 {
  text-align: center;
  margin: 5px 0 15px;
  font-weight: 700;
  color: #60067e;
  font-size: clamp(20px, 5vw, 28px);
}
table { width: 100%; border-collapse: collapse; }
th {
  background: linear-gradient(135deg, #7409d8, #2a0355);
  color: white;
  padding: 12px 8px;
}
td {
  padding: 14px 6px;
  text-align: center;
  font-size: 18px;
}
tr:nth-child(even) { background: #f8faff; }
.posicao { font-weight: bold; }
.ouro { color: #f4b400; }
.prata { color: #9aa0a6; }
.bronze { color: #cd7f32; }
input {
  width: 70px;
  padding: 8px;
  border-radius: 10px;
  border: 2px solid #ddd;
  font-size: 16px;
  text-align: center;
}
</style>
</head>
<body>
<div class="container">
  <h1>🏆 Tabela Stackfall</h1>
  <table>
    <thead>
      <tr>
        <th>Posição</th>
        <th>Jogador</th>
        <th>Pontos</th>
      </tr>
    </thead>
    <tbody id="tbody"></tbody>
  </table>
</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
import { getFirestore, doc, setDoc, onSnapshot } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

const firebaseConfig = {
  apiKey: "AIzaSyCX_wAxOISnv57Y7rBkjd0gCjXk1ptSxz4",
  authDomain: "domijenga-2006.firebaseapp.com",
  projectId: "domijenga-2006",
};

const app = initializeApp(firebaseConfig);
const db = getFirestore(app);
const ref = doc(db, "tabela", "domijenga");

const padrao = [
  { nome: "Henrique", pontos: 0 },
  { nome: "Pedro", pontos: 0 },
  { nome: "Ourico", pontos: 0 },
  { nome: "Natal", pontos: 0 }
];

let jogadores = padrao;
let salvandoLocalmente = false; // 🔒 evita loop de re-render ao salvar

onSnapshot(ref, (snap) => {
  if (salvandoLocalmente) return; // ignora echo do próprio save
  if (snap.exists()) {
    jogadores = snap.data().lista;
  } else {
    salvar();
  }
  render();
});

async function salvar() {
  salvandoLocalmente = true;
  await setDoc(ref, { lista: jogadores });
  setTimeout(() => { salvandoLocalmente = false; }, 500);
}

function medalhaClasse(pos) {
  if (pos === 0) return "ouro";
  if (pos === 1) return "prata";
  if (pos === 2) return "bronze";
  return "";
}

function ordenar() {
  jogadores.sort((a, b) => b.pontos - a.pontos);
}

function render() {
  ordenar();
  const tbody = document.getElementById("tbody");
  tbody.innerHTML = "";

  jogadores.forEach((jogador, index) => {
    const tr = document.createElement("tr");

    const tdPos = document.createElement("td");
    tdPos.className = `posicao ${medalhaClasse(index)}`;
    tdPos.textContent = `${index + 1}º`;

    const tdNome = document.createElement("td");
    tdNome.innerHTML = `<strong>${jogador.nome}</strong>`;

    const tdPontos = document.createElement("td");
    const input = document.createElement("input");
    input.type = "number";
    input.value = jogador.pontos;

    // ✅ addEventListener dentro do módulo — sem depender de escopo global
    input.addEventListener("change", () => {
      jogadores[index].pontos = Number(input.value);
      salvar();
    });

    tdPontos.appendChild(input);
    tr.appendChild(tdPos);
    tr.appendChild(tdNome);
    tr.appendChild(tdPontos);
    tbody.appendChild(tr);
  });
}
</script>
</body>
</html>
